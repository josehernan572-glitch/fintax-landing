<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fintax — Crecer es el plan, juntos es el camino</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consultoría fiscal, contable y financiera para empresas">
  <link rel="icon" type="image/svg+xml" href="logo-pestana.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===================================
       SCROLL ANIMATIONS & REVEAL EFFECTS
       =================================== */

    /* ========== KEYFRAME ANIMATIONS ========== */

    /* Fade In + Slide Up */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade In + Slide Down */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade In + Slide Left */
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Fade In + Slide Right */
    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Scale + Fade In */
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Rotate + Fade In */
    @keyframes rotateIn {
      from {
        opacity: 0;
        transform: rotate(-5deg) scale(0.95);
      }
      to {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }

    /* Line Draw (para elementos como líneas y bordes) */
    @keyframes lineDrawIn {
      from {
        opacity: 0;
        width: 0;
      }
      to {
        opacity: 1;
        width: 100%;
      }
    }

    /* Bounce in */
    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ========== DEFAULT REVEAL STATES ========== */

    /* Elementos con data-reveal: estado inicial oculto */
    [data-reveal],
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      will-change: opacity, transform;
    }

    /* Elementos revelados: estado visible */
    [data-reveal].revealed,
    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== SECTION-SPECIFIC ANIMATIONS ========== */

    /* Hero Section */
    .hero .promise-badge {
      opacity: 0;
      transform: translateY(20px);
    }

    .hero .hero-tag {
      opacity: 0;
      transform: translateY(25px);
    }

    .hero h1 {
      opacity: 0;
      transform: translateY(35px);
    }

    .hero p {
      opacity: 0;
      transform: translateY(30px);
    }

    .hero-actions {
      opacity: 0;
      transform: translateY(25px);
    }

    .hero-stat {
      opacity: 0;
      transform: translateY(40px);
    }

    .scroll-cue {
      opacity: 0.7;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* About Section Cards */
    .about-grid > div {
      opacity: 0;
      transform: translateY(40px);
    }

    .mv-card {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s ease;
    }

    /* Services List Items */
    .service-row {
      opacity: 0;
      transform: translateX(-30px);
    }

    .service-row:nth-child(even) {
      transform: translateX(30px);
    }

    .service-divider {
      opacity: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, currentColor, transparent);
      transform: scaleX(0);
      transform-origin: left;
    }

    /* Features Grid Items */
    .feature-item {
      opacity: 0;
      transform: translateY(35px);
    }

    /* Sistema Section */
    .sistema-content {
      opacity: 0;
      transform: translateY(50px);
    }

    .diamond-row span {
      opacity: 0;
      transform: scale(0.6);
    }

    /* FAQ Items */
    .faq-item {
      opacity: 0;
      transform: translateY(25px);
    }

    .faq-question {
      opacity: 0;
      transform: translateX(-20px);
    }

    /* CTA Section */
    .cta-content {
      opacity: 0;
      transform: scale(0.95);
    }

    /* Contacto Section */
    .contact-form,
    .contact-info {
      opacity: 0;
      transform: translateY(45px);
    }

    .contact-form {
      transform: translateX(-30px);
    }

    .contact-info {
      transform: translateX(30px);
    }

    /* Footer */
    .footer-content {
      opacity: 0;
      transform: translateY(30px);
    }

    .footer-column {
      opacity: 0;
      transform: translateY(25px);
    }

    .footer-column:nth-child(even) {
      transform: translateY(35px);
    }

    /* ========== STAGGER ANIMATIONS ========== */

    /* Stagger effect para listas */
    .stagger-item {
      opacity: 0;
      transform: translateY(30px);
      animation-fill-mode: forwards;
    }

    .stagger-item:nth-child(1) { animation-delay: 0.1s; }
    .stagger-item:nth-child(2) { animation-delay: 0.2s; }
    .stagger-item:nth-child(3) { animation-delay: 0.3s; }
    .stagger-item:nth-child(4) { animation-delay: 0.4s; }
    .stagger-item:nth-child(5) { animation-delay: 0.5s; }
    .stagger-item:nth-child(n+6) { animation-delay: 0.6s; }

    /* ========== MOBILE RESPONSIVE ANIMATIONS ========== */

    @media (max-width: 768px) {
      /* Reducir movimiento en dispositivos móviles para mejor rendimiento */
      .hero .promise-badge,
      .hero .hero-tag,
      .hero h1,
      .hero p,
      .hero-actions,
      .hero-stat,
      .about-grid > div,
      .feature-item,
      .sistema-content,
      .cta-content,
      .contact-form,
      .contact-info,
      .footer-content,
      .footer-column {
        transform: translateY(20px) !important;
      }

      .contact-form,
      .contact-info {
        transform: translateY(20px) !important;
      }

      /* Reducir duración de animaciones en móvil */
      [data-reveal].revealed,
      .reveal.revealed {
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }

      .diamond-row span {
        transform: scale(0.8) !important;
      }

      /* Desactivar efectos complejos en móvil */
      .scroll-cue {
        display: none;
      }

      /* Optimizar líneas para móvil */
      .service-divider {
        transform: scaleX(0) !important;
      }
    }

    @media (max-width: 480px) {
      /* Ultra mobile: efectos más simples */
      [data-reveal]:not(.service-row),
      .reveal:not(.service-row) {
        transform: translateY(15px) !important;
      }

      .stagger-item {
        transform: translateY(15px) !important;
      }

      .about-grid > div,
      .feature-item,
      .sistema-content,
      .cta-content {
        transform: translateY(15px) !important;
      }
    }

    /* ========== ADVANCED SCROLL ANIMATION CLASSES ========== */

    /* Parallax effect (opcional) */
    .parallax-bg {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    @media (max-width: 768px) {
      .parallax-bg {
        background-attachment: scroll;
      }
    }

    /* Pulse animation para elementos importantes */
    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Glow effect */
    .glow {
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 0 5px rgba(var(--accent-rgb), 0.5);
      }
      50% {
        text-shadow: 0 0 20px rgba(var(--accent-rgb), 1);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
